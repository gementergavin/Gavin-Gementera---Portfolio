<text x="865.0" y="268" font-size="11" font-weight="600" fill="#5f6b7a" text-anchor="middle">granted</text>
<rect x="900" y="240" width="240" height="76" rx="10" fill="#e6f4ea" stroke="#e6f4ea" stroke-width="0"/>
<text x="1020.0" y="271" font-size="14" font-weight="600" fill="#1e6b34" text-anchor="middle">\\DC01\Students</text><text x="1020.0" y="293" font-size="14" font-weight="600" fill="#1e6b34" text-anchor="middle">NTFS: Modify</text>
