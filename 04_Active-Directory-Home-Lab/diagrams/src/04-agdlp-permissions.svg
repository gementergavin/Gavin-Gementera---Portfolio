<text x="1020.0" y="171" font-size="14" font-weight="600" fill="#1e6b34" text-anchor="middle">\\DC01\Staff</text><text x="1020.0" y="193" font-size="14" font-weight="600" fill="#1e6b34" text-anchor="middle">NTFS: Modify</text>
