<text x="420.0" y="271" font-size="14" font-weight="600" fill="#2e5c8a" text-anchor="middle">GG-Teachers</text><text x="420.0" y="293" font-size="14" font-weight="600" fill="#2e5c8a" text-anchor="middle">global group</text>
<line x1="524" y1="278" x2="584" y2="278" stroke="#2e5c8a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="555.0" y="268" font-size="11" font-weight="600" fill="#5f6b7a" text-anchor="middle">member of</text>
