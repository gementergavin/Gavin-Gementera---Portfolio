<line x1="834" y1="378" x2="894" y2="378" stroke="#2e5c8a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="865.0" y="368" font-size="11" font-weight="600" fill="#5f6b7a" text-anchor="middle">granted</text>
<rect x="900" y="340" width="240" height="76" rx="10" fill="#fff4d6" stroke="#fff4d6" stroke-width="0"/>
<text x="1020.0" y="371" font-size="14" font-weight="600" fill="#7a5a00" text-anchor="middle">\\DC01\Students</text><text x="1020.0" y="393" font-size="14" font-weight="600" fill="#7a5a00" text-anchor="middle">NTFS: Read only</text>
<rect x="40" y="440" width="1120" height="56" rx="10" fill="#f1f3f6" stroke="#f1f3f6" stroke-width="0"/>
<text x="60" y="465" font-size="14" font-weight="600" fill="#1d2733" text-anchor="start">New teacher? Add one membership (GG-Teachers) and every teacher permission follows.</text>
<text x="60" y="486" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">Share permissions stay broad (Authenticated Users: Change); NTFS does the real control. Windows applies whichever is stricter.</text>
</svg>