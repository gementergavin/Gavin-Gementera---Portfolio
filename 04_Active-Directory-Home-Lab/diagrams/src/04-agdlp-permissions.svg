<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
<title>AGDLP share permissions</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2e5c8a"/></marker>
  <marker id="arrowgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker>
</defs>
<rect width="1200" height="520" fill="#ffffff"/>
<text x="40" y="48" font-size="26" font-weight="700" fill="#1f3864" text-anchor="start">How share permissions work: AGDLP</text>
<text x="40" y="76" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="start">Accounts go in Global role groups → Global groups go in Domain Local permission groups → those get Permissions</text>
<text x="60" y="122" font-size="12" font-weight="700" fill="#5f6b7a" text-anchor="start">ACCOUNT</text>
<text x="320" y="122" font-size="12" font-weight="700" fill="#5f6b7a" text-anchor="start">ROLE GROUP</text>
<text x="590" y="122" font-size="12" font-weight="700" fill="#5f6b7a" text-anchor="start">PERMISSION GROUP</text>
<text x="900" y="122" font-size="12" font-weight="700" fill="#5f6b7a" text-anchor="start">FOLDER PERMISSION</text>
<rect x="60" y="140" width="190" height="76" rx="10" fill="#f1f3f6" stroke="#f1f3f6" stroke-width="0"/>
<text x="155.0" y="171" font-size="14" font-weight="600" fill="#1d2733" text-anchor="middle">maria.lopez</text><text x="155.0" y="193" font-size="14" font-weight="600" fill="#1d2733" text-anchor="middle">teacher account</text>
<line x1="254" y1="178" x2="314" y2="178" stroke="#2e5c8a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="285.0" y="168" font-size="11" font-weight="600" fill="#5f6b7a" text-anchor="middle">member of</text>
<rect x="320" y="140" width="200" height="76" rx="10" fill="#e8f0fa" stroke="#e8f0fa" stroke-width="0"/>
<text x="420.0" y="171" font-size="14" font-weight="600" fill="#2e5c8a" text-anchor="middle">GG-Teachers</text><text x="420.0" y="193" font-size="14" font-weight="600" fill="#2e5c8a" text-anchor="middle">global group</text>
<line x1="524" y1="178" x2="584" y2="178" stroke="#2e5c8a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="555.0" y="168" font-size="11" font-weight="600" fill="#5f6b7a" text-anchor="middle">member of</text>
<rect x="590" y="140" width="240" height="76" rx="10" fill="#efedff" stroke="#efedff" stroke-width="0"/>
<text x="710.0" y="171" font-size="14" font-weight="600" fill="#4b3fa0" text-anchor="middle">DL-Staff-Share-Modify</text><text x="710.0" y="193" font-size="14" font-weight="600" fill="#4b3fa0" text-anchor="middle">domain local group</text>
<line x1="834" y1="178" x2="894" y2="178" stroke="#2e5c8a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="865.0" y="168" font-size="11" font-weight="600" fill="#5f6b7a" text-anchor="middle">granted</text>
