<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
<title>Lab architecture</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2e5c8a"/></marker>
  <marker id="arrowgray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/></marker>
</defs>
<rect width="1200" height="620" fill="#ffffff"/>
<text x="40" y="48" font-size="26" font-weight="700" fill="#1f3864" text-anchor="start">Lab architecture</text>
<text x="40" y="76" font-size="15" font-weight="400" fill="#5f6b7a" text-anchor="start">Two virtual machines on one home PC, on a private VirtualBox network with internet access through NAT</text>
<rect x="40" y="100" width="1120" height="480" rx="14" fill="#fafbfd" stroke="#c9d2dd" stroke-width="2"/>
<text x="64" y="132" font-size="17" font-weight="700" fill="#1d2733" text-anchor="start">Your Windows PC: 16 GB RAM · VirtualBox 7</text>
<text x="64" y="156" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">Windows keeps about 8 GB; each VM gets 4 GB</text>
<rect x="930" y="120" width="200" height="70" rx="35" fill="#f1f3f6" stroke="#c9d2dd" stroke-width="1.5"/>
<text x="1030" y="162" font-size="17" font-weight="700" fill="#1d2733" text-anchor="middle">Internet</text>
<rect x="70" y="190" width="1060" height="362" rx="12" fill="#e8f0fa" stroke="#b8cde6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="94" y="222" font-size="17" font-weight="700" fill="#2e5c8a" text-anchor="start">NAT Network  PCUSD-Lab  ·  10.0.10.0/24</text>
<text x="94" y="246" font-size="14" font-weight="400" fill="#5f6b7a" text-anchor="start">VirtualBox&#x27;s own DHCP is OFF, so DC01 is the only DHCP server</text>
<rect x="900" y="216" width="210" height="66" rx="10" fill="#ffffff" stroke="#b8cde6" stroke-width="1.5"/>
<text x="1005" y="244" font-size="14" font-weight="600" fill="#1d2733" text-anchor="middle">Gateway 10.0.10.1</text><text x="1005" y="264" font-size="14" font-weight="600" fill="#1d2733" text-anchor="middle">(VirtualBox NAT)</text>
<line x1="1005" y1="216" x2="1030" y2="192" stroke="#2e5c8a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="100" y="290" width="470" height="240" rx="12" fill="#ffffff" stroke="#1f3864" stroke-width="2"/>
<rect x="100" y="290" width="470" height="46" rx="12" fill="#1f3864" stroke="#1f3864" stroke-width="0"/>
<rect x="100" y="320" width="470" height="16" fill="#1f3864"/>
<text x="122" y="320" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">DC01 · Windows Server 2025</text>
<text x="122" y="364" font-size="15" font-weight="600" fill="#1d2733" text-anchor="start">Static IP 10.0.10.10</text><text x="122" y="386" font-size="15" font-weight="600" fill="#1d2733" text-anchor="start">4 GB RAM · 2 CPUs · 60 GB disk</text>
<rect x="122" y="410" width="180" height="26" rx="13" fill="#efedff" stroke="#efedff" stroke-width="0"/><text x="212.0" y="428" font-size="13" font-weight="600" fill="#4b3fa0" text-anchor="middle">AD DS · pcusd.internal</text>
<rect x="312" y="410" width="136" height="26" rx="13" fill="#e6f4ea" stroke="#e6f4ea" stroke-width="0"/><text x="380.0" y="428" font-size="13" font-weight="600" fill="#1e6b34" text-anchor="middle">DNS + forwarders</text>
<rect x="122" y="448" width="180" height="26" rx="13" fill="#fff4d6" stroke="#fff4d6" stroke-width="0"/><text x="212.0" y="466" font-size="13" font-weight="600" fill="#7a5a00" text-anchor="middle">DHCP 10.0.10.100 – 200</text>
<rect x="312" y="448" width="107" height="26" rx="13" fill="#e8f0fa" stroke="#e8f0fa" stroke-width="0"/><text x="365.5" y="466" font-size="13" font-weight="600" fill="#2e5c8a" text-anchor="middle">Group Policy</text>
<rect x="122" y="486" width="267" height="26" rx="13" fill="#f1f3f6" stroke="#f1f3f6" stroke-width="0"/><text x="255.5" y="504" font-size="13" font-weight="600" fill="#1d2733" text-anchor="middle">File shares: Staff · Students · IT</text>
<rect x="700" y="330" width="410" height="190" rx="12" fill="#ffffff" stroke="#2e5c8a" stroke-width="2"/>
<rect x="700" y="330" width="410" height="46" rx="12" fill="#2e5c8a" stroke="#2e5c8a" stroke-width="0"/>
<rect x="700" y="360" width="410" height="16" fill="#2e5c8a"/>
<text x="722" y="360" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">CLIENT01 · Windows 11 Enterprise</text>
<text x="722" y="404" font-size="15" font-weight="400" fill="#1d2733" text-anchor="start">IP from DC01&#x27;s DHCP (10.0.10.100+)</text><text x="722" y="428" font-size="15" font-weight="400" fill="#1d2733" text-anchor="start">DNS server = 10.0.10.10 (DC01)</text><text x="722" y="452" font-size="15" font-weight="400" fill="#1d2733" text-anchor="start">Joined to pcusd.internal</text><text x="722" y="476" font-size="15" font-weight="400" fill="#1d2733" text-anchor="start">4 GB RAM · 2 CPUs · 64 GB disk</text>
<line x1="578" y1="452" x2="694" y2="452" stroke="#2e5c8a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="636" y="412" font-size="13" font-weight="600" fill="#2e5c8a" text-anchor="middle">DHCP</text><text x="636" y="430" font-size="13" font-weight="600" fill="#2e5c8a" text-anchor="middle">DNS</text>
<text x="636" y="480" font-size="13" font-weight="600" fill="#2e5c8a" text-anchor="middle">sign-in</text><text x="636" y="498" font-size="13" font-weight="600" fill="#2e5c8a" text-anchor="middle">Group Policy</text><text x="636" y="516" font-size="13" font-weight="600" fill="#2e5c8a" text-anchor="middle">file shares</text>
</svg>