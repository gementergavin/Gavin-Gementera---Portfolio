<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
<title>OU structure and Group Policy links</title>
<defs>
